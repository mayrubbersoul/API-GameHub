info:
  name: postjogos
  type: http

http:
  method: POST
  url: http://localhost:3000/jogos/
  body:
    type: json
    data: |-
      {
        "titulo":"Crash Bandicoot",
        "ano_lancamento": 1996,
        "estudio_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
